<title>Ciudadanía 128 — Práctica</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%230d1b2a'/%3E%3Ctext x='90' y='118' font-size='90' text-anchor='middle' fill='%23e0b243' font-family='Georgia,serif'%3E128%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0d1b2a; --bg2:#132a41; --card:#1b3a5c; --line:#2c5580;
  --ink:#f3f6fa; --dim:#a8bed6; --gold:#e0b243; --good:#3fb96b; --bad:#e05c5c;
  --blue:#4a90d9;
  --pad: env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:17px; line-height:1.45; overscroll-behavior:none;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;background:none;cursor:pointer}
.app{max-width:620px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:var(--bg2);
     border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.bar h1{font-size:16px;margin:0;font-weight:600;flex:1;letter-spacing:.2px}
.bar .ic{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;
         font-size:19px;background:#ffffff12}
.bar .ic:active{background:#ffffff25}
.prog{height:4px;background:#ffffff18}
.prog i{display:block;height:100%;background:var(--gold);transition:width .25s}

/* ---------- generic ---------- */
.wrap{flex:1;padding:16px 14px calc(28px + var(--pad));display:flex;flex-direction:column;gap:14px}
.hero{text-align:center;padding:20px 6px 4px}
.hero .n{font-size:54px;font-weight:800;color:var(--gold);line-height:1;font-family:Georgia,serif}
.hero h2{margin:6px 0 2px;font-size:20px}
.hero p{margin:0;color:var(--dim);font-size:14px}

.tile{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.tile h3{margin:0 0 10px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:700}

.btn{display:block;width:100%;padding:15px 16px;border-radius:14px;background:var(--blue);
     font-weight:650;font-size:17px;text-align:center;margin-top:10px}
.btn:active{transform:scale(.985)}
.btn.gold{background:var(--gold);color:#14243a}
.btn.ghost{background:#ffffff10;border:1px solid var(--line)}
.btn.sm{padding:11px;font-size:15px;margin-top:8px}

.modes{display:grid;gap:10px}
.mode{display:flex;gap:12px;align-items:center;text-align:left;padding:14px;border-radius:14px;
      background:#ffffff0d;border:1px solid var(--line);width:100%}
.mode.on{border-color:var(--gold);background:#e0b2431f}
.mode .em{font-size:24px;width:30px;text-align:center;flex:none}
.mode b{display:block;font-size:16px}
.mode span{display:block;color:var(--dim);font-size:13px;line-height:1.3}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;
     border-bottom:1px solid #ffffff14}
.row:last-child{border-bottom:0}
.row .lbl b{display:block;font-size:15px;font-weight:600}
.row .lbl span{display:block;color:var(--dim);font-size:12.5px}

/* switch */
.sw{width:50px;height:30px;border-radius:15px;background:#ffffff22;position:relative;flex:none;transition:background .18s}
.sw i{position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:12px;background:#fff;transition:left .18s}
.sw.on{background:var(--good)} .sw.on i{left:23px}

/* stepper */
.step{display:flex;align-items:center;gap:6px;flex:none}
.step button{width:34px;height:34px;border-radius:9px;background:#ffffff18;font-size:19px;font-weight:600;
             display:flex;align-items:center;justify-content:center}
.step button:active{background:#ffffff30}
.step .v{min-width:56px;text-align:center;font-variant-numeric:tabular-nums;font-weight:650;font-size:15px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:20px;background:#ffffff10;border:1px solid var(--line);font-size:13.5px}
.chip.on{background:var(--gold);color:#14243a;border-color:var(--gold);font-weight:650}

/* ---------- card ---------- */
.qmeta{display:flex;justify-content:space-between;align-items:center;color:var(--dim);font-size:13px}
.qmeta .sec{font-size:12px;text-transform:uppercase;letter-spacing:.06em;
            overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62%}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 18px;flex:1;
      display:flex;flex-direction:column;justify-content:center;min-height:210px}
.q{font-size:23px;font-weight:600;line-height:1.32}
.ph{color:var(--gold);font-size:15.5px;font-style:italic;margin-top:9px;line-height:1.35}
.es{color:var(--dim);font-size:15.5px;margin-top:7px;line-height:1.35}
.warn{margin-top:12px;background:#e0b2431f;border:1px solid #e0b24355;border-radius:10px;
      padding:9px 11px;font-size:13px;color:var(--gold)}

.ans{background:#0f2740;border:1px solid var(--line);border-radius:16px;padding:14px}
.ans h4{margin:0 0 9px;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--good);font-weight:700}
.ai{padding:9px 0;border-bottom:1px solid #ffffff10}
.ai:last-child{border-bottom:0}
.ai .en{font-weight:600;font-size:17px}
.ai .p{color:var(--gold);font-size:14px;font-style:italic}
.ai .s{color:var(--dim);font-size:14px}
.more{color:var(--dim);font-size:13px;padding-top:8px;text-align:center}

.speak{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:20px;
       background:#ffffff12;font-size:14px;margin-top:12px}
.speak:active{background:#ffffff25}

.grade{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.grade button{padding:16px;border-radius:14px;font-weight:700;font-size:16px}
.g-no{background:#e05c5c26;border:1px solid #e05c5c88;color:#ffb3b3}
.g-yes{background:#3fb96b26;border:1px solid #3fb96b88;color:#a5edc0}

.opts{display:grid;gap:9px;margin-top:4px}
.opt{text-align:left;padding:14px;border-radius:13px;background:#ffffff0d;border:1.5px solid var(--line);
     font-size:16px;line-height:1.3}
.opt.right{background:#3fb96b2e;border-color:var(--good)}
.opt.wrong{background:#e05c5c2e;border-color:var(--bad)}
.opt small{display:block;color:var(--gold);font-style:italic;font-size:13px;margin-top:3px}

.cd{text-align:center;font-size:15px;font-weight:600;color:var(--gold);padding:10px 0 2px;
     font-variant-numeric:tabular-nums;min-height:22px}
.cd.paused{color:var(--dim)}
.tbar{display:flex;gap:10px;margin-top:2px}
.tbar button{flex:1;padding:13px;border-radius:13px;background:#ffffff12;font-size:15px;font-weight:600}

.count{align-self:center;background:#00000055;border:1px solid var(--line);border-radius:20px;
       padding:6px 16px;font-size:13px;color:var(--gold);font-variant-numeric:tabular-nums;
       margin-top:2px}

/* ---------- stats ---------- */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 8px;text-align:center}
.stat b{display:block;font-size:25px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11px;color:var(--dim);margin-top:3px;letter-spacing:.03em}
.bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(30px,1fr));gap:5px;margin-top:4px}
.qb{aspect-ratio:1;border-radius:6px;background:#ffffff12;display:flex;align-items:center;justify-content:center;
    font-size:10.5px;color:#ffffff70;font-variant-numeric:tabular-nums}
.qb.ok{background:#3fb96b40;color:#c8f2d8} .qb.mid{background:#e0b24340;color:#f5dfae}
.qb.bad{background:#e05c5c40;color:#f7c4c4}
.hist{font-size:13.5px;color:var(--dim)}
.hist div{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #ffffff12}

.res{text-align:center;padding:8px 0}
.res .big{font-size:60px;font-weight:800;font-family:Georgia,serif;line-height:1}
.res .pass{color:var(--good)} .res .fail{color:var(--bad)}
.small{font-size:13px;color:var(--dim);text-align:center;line-height:1.5}
.search{width:100%;padding:13px 14px;border-radius:13px;background:#ffffff10;border:1px solid var(--line);
        color:var(--ink);font-size:16px;font-family:inherit}
.search::placeholder{color:#ffffff55}
.secH{margin:14px 0 -6px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold);font-weight:700}
.li{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.lih{display:flex;gap:11px;align-items:flex-start;text-align:left;width:100%;padding:13px 14px;font-size:15.5px;line-height:1.32}
.lih:active{background:#ffffff10}
.ln{flex:none;min-width:28px;color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;padding-top:1px}
.lq{flex:1;font-weight:600}
.lb{padding:0 14px 10px 53px}
.li .ans{margin:0 12px 12px;border-radius:12px}
.hidden{display:none!important}
a{color:var(--blue)}
</style>
</head>

<script>
const DATA = [{"n":1,"q":"What is the form of government of the United States?","qp":"(Uat is da form of government of di iunaired steits?)","qs":"¿Cuál es la forma de gobierno de los Estados Unidos?","a":[["Republic","(Repoblic)","República"],["Constitution-based federal republic","(Constitushon-beisd federal republic)","República federal constitucional"],["Representative democracy","(Represenarif democracy)","Democracia representativa"]],"sec":"A: Principios del gobierno estadounidense","cat":"GOBIERNO ESTADOUNIDENSE"},{"n":2,"q":"What is the Supreme Law of the land?","qp":"(Uat is de suprim ló of de land?)","qs":"¿Cuál es la Ley Suprema de la Nación?","a":[["(U.S.) Constitution","(Iu Es Constitushon)","(Constitución) de los EEUU"]],"sec":"A: Principios del gobierno estadounidense","cat":"GOBIERNO ESTADOUNIDENSE"},{"n":3,"q":"Name one thing the U.S. Constitution does.","qp":"(Neim uan zing di iu es constitushon dos)","qs":"Nombra una cosa que hace la Constitución de los Estados Unidos.","a":[["Forms the government","(Forms de government)","Forma el gobierno"],["Defines powers of government","(Difains pauers of government)","Define los poderes del gobierno"],["Defines the parts of government","(Difains de parts of government)","Define las partes del gobierno"],["Protects the rights of the people","(Proteks de raits of de pipol)","Protege los derechos de las personas"]],"sec":"A: Principios del gobierno estadounidense","cat":"GOBIERNO ESTADOUNIDENSE"},{"n":4,"q":"The U.S. Constitution starts with the words \"We the People.\" What does \"We the People\" mean?","qp":"(Di iu es constitushon starts uid da uards \"Ui da pipol\". Uat dos \"Ui da pipol\" min?)","qs":"La Constitución de los Estados Unidos comienza con las palabras \"Nosotros, el pueblo\". ¿Qué significa \"Nosotros el pueblo\"?","a":[["Self-government","(Self-government)","Autogobierno"],["Popular sovereignty","(Popular sovereinti)","Soberanía popular"],["Consent of the governed","(Consent of de governd)","Consentimiento de los gobernados"],["People should govern themselves","(Pipol shud govern demselvs)","Las personas deben gobernarse a sí mismas"],["(Example of) social contract","(Exampol of soshal contract)","(Ejemplo de) contrato social"]],"sec":"A: Principios del gobierno estadounidense","cat":"GOBIERNO ESTADOUNIDENSE"},{"n":5,"q":"How are changes made to the U.S. Constitution?","qp":"(¿Jau ar chenyes meid tu di iu es constitushon?)","qs":"¿Cómo se hacen los cambios a la Constitución de los Estados Unidos?","a":[["Amendments","(Amendments)","Enmiendas"],["The amendment process","(De amendment proces)","El proceso de enmienda"]],"sec":"A: Principios del gobierno estadounidense","cat":"GOBIERNO ESTADOUNIDENSE"},{"n":6,"q":"What does the Bill of Rights protect?","qp":"(Uat dos de Bil of Raits protect?)","qs":"¿Qué protege la Declaración de Derechos?","a":[["(The basic) rights of Americans","(De beisik raits of americans)","Los derechos (básicos) de los estadounidenses"],["(The basic) rights of people living in the United States","(De beisik raits of pipol livin in di iunaired steits)","Los derechos (básicos) de las personas que viven en los Estados Unidos"]],"sec":"A: Principios del gobierno estadounidense","cat":"GOBIERNO ESTADOUNIDENSE"},{"n":7,"q":"How many amendments does the U.S. Constitution have?","qp":"(Jau meni amendments dos de iu es constitushon jav?)","qs":"¿Cuántas enmiendas tiene la Constitución de Estados Unidos?","star":true,"a":[["Twenty-seven (27)","(Tuenti-seven)","Veintisiete (27)"]],"sec":"A: Principios del gobierno estadounidense","cat":"GOBIERNO ESTADOUNIDENSE"},{"n":8,"q":"Why is the Declaration of Independence important?","qp":"(Uai is de declereishon of independens important?)","qs":"¿Por qué es importante la Declaración de Independencia?","a":[["It says America is free from British control.","(It ses America is fri from british control)","Dice que Estados Unidos está libre del control británico."],["It says all people are created equal.","(It ses ol pipol ar crieired icual)","Dice que todas las personas son iguales."],["It identifies inherent rights.","(It aidentifais injerent raits)","Identifica derechos inherentes."],["It identifies individual freedoms.","(It aidentifais individual fridoms)","Identifica las libertades individuales."]],"sec":"A: Principios del gobierno estadounidense","cat":"GOBIERNO ESTADOUNIDENSE"},{"n":9,"q":"What founding document said the American colonies were free from Britain?","qp":"(¿Uat faundin document sed de American colonis uer fri from briten?)","qs":"¿Qué documento fundacional dijo que las colonias americanas estaban libres de Gran Bretaña?","a":[["Declaration of Independence","(Declereishon of independens)","Declaración de Independencia"]],"sec":"A: Principios del gobierno estadounidense","cat":"GOBIERNO ESTADOUNIDENSE"},{"n":10,"q":"Name two important ideas from the Declaration of Independence and the U.S. Constitution.","qp":"(Neim tu important aidias from de declereishon of independens and de iu es constitushon)","qs":"Nombre dos ideas importantes de la Declaración de Independencia y la Constitución de los Estados Unidos.","a":[["Equality","(Icuality)","Igualdad"],["Liberty","(Librti)","Libertad"],["Social contract","(Soshal contract)","Contrato social"],["Natural rights","(Natural raits)","Derechos naturales"],["Limited government","(Limited government)","Gobierno limitado"],["Self-government","(Self-government)","Autogobierno"]],"sec":"A: Principios del gobierno estadounidense","cat":"GOBIERNO ESTADOUNIDENSE"},{"n":11,"q":"The words \"Life, Liberty, and the pursuit of Happiness\" are in what founding document?","qp":"(Da uords \"laif, liberti, and de persut of japines\" ar in uat faundin document?)","qs":"¿En qué documento fundacional se encuentran las palabras \"Vida, libertad y la búsqueda de la felicidad\"?","a":[["Declaration of Independence","(Declereishon of independens)","Declaración de Independencia"]],"sec":"A: Principios del gobierno estadounidense","cat":"GOBIERNO ESTADOUNIDENSE"},{"n":12,"q":"What is the economic system in the United States?","qp":"(Uat is di economic sistem of di iunaired steits?)","qs":"¿Cuál es el sistema económico de los Estados Unidos?","star":true,"a":[["Capitalism","(Capiralism)","Capitalismo"],["Free market economy","(Fri market economy)","Economía de mercado libre"]],"sec":"A: Principios del gobierno estadounidense","cat":"GOBIERNO ESTADOUNIDENSE"},{"n":13,"q":"What is the \"Rule of Law\"?","qp":"(Uat is de rul of lo?)","qs":"¿Cuál es la regla de la Ley?","a":[["Everyone must follow the law.","(Evriuan most falou de lo)","Todos deben seguir la ley."],["Leaders must obey the law.","(Liders most obei de lo)","Los líderes deben obedecer la ley."],["Government must obey the law.","(Government most obei de lo)","El gobierno debe obedecer la ley."],["No one is above the law.","(No uan is abov de lo)","Nadie está por encima de la ley."]],"sec":"A: Principios del gobierno estadounidense","cat":"GOBIERNO ESTADOUNIDENSE"},{"n":14,"q":"Many documents influenced the U.S. Constitution. Name one.","qp":"(Meni documents influenst de iu es constitushon. Neim uan)","qs":"Muchos documentos influyeron en la Constitución de los Estados Unidos. Nombra uno.","a":[["Declaration of Independence","(Declereishon of independens)","Declaración de Independencia"],["Articles of Confederation","(Aricols of confedereishon)","Artículos de la Confederación"],["Federalist Papers","(Federalist peipers)","Papeles Federalistas"],["Anti-Federalist Papers","(Anti-federalist peipers)","Papeles anti-federalistas"],["Virginia Declaration of Rights","(Viryinia declereishon of raits)","Declaración de derechos de Virginia"],["Fundamental Orders of Connecticut","(Fandamentol orders of Connericut)","Órdenes fundamentales de Connecticut"],["Mayflower Compact","(Meiflauer compact)","Mayflower Compact"],["Iroquois Great Law of Peace","(Irocuoi Greit lo of piis)","Gran ley de paz iroquesa"]],"sec":"A: Principios del gobierno estadounide const store={
  get(){ try{ return JSON.parse(localStorage.getItem(KEY))||{} }catch(e){ return mem } },
  set(v){ try{ localStorage.setItem(KEY,JSON.stringify(v)) }catch(e){ mem=v } }
};
const defaults={
  mode:'cards', showPh:true, showEs:true, hands:false,
  secQ:6, secA:5, rate:0.85, shuffle:true, sections:'all', onlyMissed:false, examLen:20, voiceURI:''
};
let S = Object.assign({}, defaults, store.get().settings||{});

function save(){ store.set({settings:S, stats:ST}); }

/* ============ speech ============ */
let voices=[];
function loadVoices(){ voices = (window.speechSynthesis? speechSynthesis.getVoices():[])||[]; }
loadVoices();
if(window.speechSynthesis) speechSynthesis.onvoiceschanged=loadVoices;
let vTries=0;
const vPoll=setInterval(()=>{ loadVoices(); if(voices.length||++vTries>15) clearInterval(vPoll); },400);

const JUNK=/eloquence|novelty|whisper|bells|boing|bubbles|cellos|deranged|good news|bad news|jester|organ|superstar|trinoids|zarvox|wobble|bahh|albert|fred|junior|ralph|kathy|princess|hysterical|grandma|grandpa|rocko|shelley|sandy|flo|reed/i;
function pickVoice(lang){
  if(lang==='es'){
    for(const pf of ['es-US','es-MX','es-ES','es']){
      const v=voices.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase().startsWith(pf));
      if(v) return v;
    }
    return null;
  }
  // Safari ignores voice selection anyway; just avoid the joke voices.
  const en=voices.filter(v=>v.lang&&v.lang.toLowerCase().startsWith('en')&&!JUNK.test(v.name||''));
  return en.find(v=>v.lang.toLowerCase().startsWith('en-us')) || en[0] || null;
}
function cleanText(t){ return String(t).replace(/[()]/g,' ').replace(/\s+/g,' ').trim(); }
function stopSpeak(){ try{ speechSynthesis.cancel() }catch(e){} }
function speak(text, lang, cb){
  if(!window.speechSynthesis || !text){ cb&&cb(); return; }
  try{
    const u=new SpeechSynthesisUtterance(cleanText(text)||String(text));
    const v=pickVoice(lang||'en'); if(v) u.voice=v;
    u.lang = v? v.lang : (lang==='es'?'es-US':'en-US');
    u.rate = S.rate; u.pitch=1;
    let done=false; const fin=()=>{ if(done)return; done=true; cb&&cb(); };
    u.onend=fin; u.onerror=fin;
    speechSynthesis.speak(u);
    const cps = 13 * Math.max(0.4, S.rate);
    setTimeout(fin, Math.min(15000, 700 + (u.text.length/cps)*1000));
  }catch(e){ cb&&cb(); }
}

/* ---------- audio grabado (carpeta ./audio) con la voz del telefono de respaldo ---------- */
let AUDIO_OK=null, AUDIO_VOICE='', curAudio=null;
const pad3=n=>String(n).padStart(3,'0');
const clipURL=id=>'audio/'+id+'.m4a';
function probeAudio(){
  return new Promise(res=>{
    let done=false; const fin=v=>{ if(done)return; done=true; AUDIO_OK=v; res(v); };
    try{
      const a=new Audio(); a.preload='metadata';
      a.addEventListener('loadedmetadata',()=>fin(true),{once:true});
      a.addEventListener('error',()=>fin(false),{once:true});
      a.src=clipURL('q001');
    }catch(e){ fin(false); }
    setTimeout(()=>fin(false),6000);
  });
}
if(/^https?:/.test(location.protocol)){
  fetch('audio/voz.txt').then(r=>r.ok?r.text():'').then(t=>{AUDIO_VOICE=(t||'').trim()}).catch(()=>{});
}
function stopAudio(){ if(curAudio){ try{curAudio.pause()}catch(e){} curAudio=null; } }
function stopAll(){ stopSpeak(); stopAudio(); }
function say(id, text, cb){
  stopAll();
  if(AUDIO_OK && id){
    let done=false;
    const a=new Audio(clipURL(id)); curAudio=a;
    a.playbackRate=Math.min(2,Math.max(0.5,S.rate));
    const fin=()=>{ if(done)return; done=true; if(curAudio===a)curAudio=null; cb&&cb(); };
    const fall=()=>{ if(done)return; done=true; if(curAudio===a)curAudio=null; speak(text,'en',cb); };
    a.onended=fin; a.onerror=fall;
    try{ const pr=a.play(); if(pr&&pr.catch) pr.catch(fall); }catch(e){ fall(); }
    setTimeout(()=>{ if(!done) fin(); },30000);
    return;
  }
  speak(text,'en',cb);
}

/* ============ deck ============ */
function buildDeck(){
  let d=DATA.slice();
  if(S.sections!=='all') d=d.filter(x=>x.cat===S.sections);
  if(S.onlyMissed){ const m=d.filter(x=>qstat(x.n).wrong>0); if(m.length) d=m; }
  if(S.mode==='exam'){ d=shuffled(DATA).slice(0,S.examLen); return d; }
  if(S.shuffle) d=shuffled(d);
  return d;
}

/* ============ session ============ */
let sess=null;
function startSession(){
  const deck=buildDeck();
  sess={ deck, i:0, right:0, wrong:0, t0:Date.now(), mode:S.mode, revealed:false, picked:null,
         answered:false, phase:'q', paused:false, cd:0, cdCb:null, cdEnd:0, cdLeft:0 };
  if(S.mode==='hands'){
    clearTimers(); screen='study'; keepAwake(true); humOn(true);
    backEl.style.visibility='visible'; render(); handsStep();
  } else go('study');
}
function record(n, ok){
  const s=qstat(n); s.seen++;
  if(ok===true) s.right++; else if(ok===false) s.wrong++;
  ST.byQ[n]=s; save();
}
function next(){
  sess.revealed=false; sess.picked=null; sess.answered=false;
  sess.i++;
  if(sess.i>=sess.deck.length){ finish(); return; }
  go('study');
}
function finish(){
  sess.secs=(Date.now()-sess.t0)/1000;
  ST.sessions.unshift({d:new Date().toISOString().slice(0,10), m:sess.mode, t:sess.deck.length,
                       r:sess.right, w:sess.wrong, s:Math.round(sess.secs)});
  ST.sessions=ST.sessions.slice(0,40); save();
  go('result');
}

function startCountdown(secs, cb){
  clearHands();
  sess.cdCb=cb; sess.cdEnd=Date.now()+secs*1000; sess.cd=Math.ceil(secs);
  paintCd();
  cdIV=setInterval(()=>{
    if(sess.paused) return;
    const left=(sess.cdEnd-Date.now())/1000;
    sess.cd=Math.max(0,Math.ceil(left)); paintCd();
    if(left<=0){ clearHands(); sess.cdCb=null; cb(); }
  },200);
}
function paintCd(){
  const el=document.getElementById('cd'); if(!el) return;
  if(sess.paused){ el.textContent='⏸ En pausa'; el.className='cd paused'; return; }
  if(sess.cdCb==null && !cdIV){ el.textContent='🔊 Reproduciendo…'; el.className='cd'; return; }
  el.textContent = (sess.phase==='q' ? 'Responde en voz alta… ' : 'Siguiente pregunta en ') + sess.cd + 's';
  el.className='cd';
}
function pauseHands(){
  sess.paused=true;
  sess.cdLeft = sess.cdEnd ? Math.max(0,(sess.cdEnd-Date.now())/1000) : 0;
  clearHands(); stopAll();
}
function resumeHands(){
  sess.paused=false;
  if(sess.cdCb && sess.cdLeft>0.2){ const cb=sess.cdCb; startCountdown(sess.cdLeft, cb); }
  else handsStep();
}
function handsStep(){
  if(screen!=='study'||!sess||sess.paused) return;
  const q=sess.deck[sess.i];
  if(!q){ finish(); return; }
  const advance=()=>{
    record(q.n,null); sess.i++; sess.phase='q'; sess.cdCb=null;
    if(sess.i>=sess.deck.length){ finish(); return; }
    render(); handsStep();
  };
  if(sess.phase==='q'){
    sess.cdCb=null; paintCd();
    say('q'+pad3(q.n), q.q, ()=>{
      if(screen!=='study'||sess.paused) return;
      startCountdown(S.secQ, ()=>{ sess.phase='a'; render(); handsStep(); });
    });
  } else {
    sess.cdCb=null; paintCd();
    say('a'+pad3(q.n), q.a.slice(0,2).map(a=>a[0]).join('. '), ()=>{
      if(screen!=='study'||sess.paused) return;
      startCountdown(S.secA, advance);
    });
  }
}

  const nx=$(`<button>Saltar ›</button>`);
  pb.onclick=()=>{ if(sess.paused){ resumeHands(); } else { pauseHands(); } render(); };
  nx.onclick=()=>{ clearHands(); stopAll(); sess.cdCb=null; record(q.n,null);
    sess.i++; sess.phase='q';

function ChoiceUI(q){
  if(!sess.opts || sess.optsFor!==q.n){
    const correct=q.a[Math.floor(Math.random()*q.a.length)][0];
    const pool=DATA.filter(d=>d.n!==q.n && d.cat===q.cat);
    const wide=DATA.filter(d=>d.n!==q.n);
    const bad=[]; const seen=new Set([correct.toLowerCase()]);
    const tryAdd=(src)=>{ for(const d of shuffled(src)){ if(bad.length>=3) break;
        const c=d.a[Math.floor(Math.random()*d.a.length)][0];
        if(!c||seen.has(c.toLowerCase()))continue; seen.add(c.toLowerCase()); bad.push(c); } };
    tryAdd(pool); if(bad.length<3) tryAdd(wide);
    sess.opts=shuffled([correct,...bad]); sess.correct=correct; sess.optsFor=q.n;
  }
  const box=$(`<div class="opts"></div>`);
  sess.opts.forEach(o=>{
    const b=$(`<button class="opt">${esc(o)}</button>`);
    if(sess.answered){
      if(o===sess.correct) b.className='opt right';
      else if(o===sess.picked) b.className='opt wrong';
    }
    b.onclick=()=>{
      if(sess.answered) return;
      sess.answered=true; sess.picked=o;
      const ok = o===sess.correct;
      record(q.n, ok); ok?sess.right++:sess.wrong++;
      Study();
      if(ok && S.secA<=1){ next(); }
    };
    box.append(b);
  });
  view.append(box);
  if(sess.answered){
    view.append($(answersHTML(q,3)));
    const b=$(`<button class="btn">${sess.i+1===sess.deck.length?'Ver resultado':'Siguiente ›'}</button>`);
    b.onclick=()=>{ sess.opts=null; next(); };
    view.append(b);
  }
}

  const again=$(`<button class="btn gold">Practicar otra vez</button>`); again.onclick=()=>startSession();
  const missed=$(`<button class="btn ghost sm">Repasar solo las falladas</button>`);
  missed.onclick=()=>{ S.onlyMissed=true; save(); startSession(); };
  const home=$(`<button class="btn ghost sm">Volver al inicio</button>`); home.onclick=()=>go('home');
  view.append(again,missed,home);
}

/* ============ browse all ============ */
let listQuery='', listOpen={};
function List(){
  titleEl.textContent='Las 128 preguntas'; progBar.style.width='0';
  view.innerHTML='';
  const sb=$(`<input class="search" type="search" placeholder="Buscar en inglés o español…" value="${esc(listQuery)}">`);
  sb.oninput=()=>{ listQuery=sb.value; const p=sb.selectionStart; List();
                   const nb=view.querySelector('.search'); nb.focus(); try{nb.setSelectionRange(p,p)}catch(e){} };
  view.append(sb);
  const qy=listQuery.trim().toLowerCase();
  const items=DATA.filter(d=>!qy || (d.q+' '+d.qs+' '+d.a.map(a=>a[0]+' '+a[2]).join(' ')).toLowerCase().includes(qy));
  view.append($(`<p class="small" style="margin:-4px 0 0">${items.length} de 128 · toca una pregunta para ver la respuesta</p>`));
  let lastSec='';
  items.forEach(d=>{
    if(d.sec!==lastSec && !qy){ lastSec=d.sec; view.append($(`<h3 class="secH">${esc(d.cat)} · ${esc(d.sec)}</h3>`)); }
    const it=$(`<div class="li"></div>`);
    const hd=$(`<button class="lih"><span class="ln">${d.n}</span><span class="lq">${esc(d.q)}</span></button>`);
    hd.onclick=()=>{ listOpen[d.n]=!listOpen[d.n]; List(); };
    it.append(hd);
    if(listOpen[d.n]){
      let h=`<div class="lb">`;
      if(d.qp) h+=`<div class="ph">${esc(d.qp)}</div>`;
      if(d.qs) h+=`<div class="es">${esc(d.qs)}</div>`;
      if(d.live) h+=`<div class="warn">⚠️ ${esc(d.live)}</div>`;
      h+=`</div>`+answersHTML(d,0);
      const holder=document.createElement('div');
      holder.innerHTML=h;
      while(holder.firstChild) it.appendChild(holder.firstChild);
      const sp=$(`<button class="speak" style="margin:0 14px 14px">🔊 Escuchar</button>`);
      sp.onclick=(ev)=>{ ev.stopPropagation();
        say('q'+pad3(d.n), d.q, ()=>say('a'+pad3(d.n), d.a.slice(0,2).map(a=>a[0]).join('. '))); };
      it.appendChild(sp);
    }
    view.append(it);
  });
  const home=$(`<button class="btn ghost">Volver</button>`); home.onclick=()=>go('home'); view.append(home);
}

/* ============ settings ============ */
function Settings(){
  titleEl.textContent='Ajustes'; progBar.style.width='0';
  view.innerHTML='';

  const t1=$(`<div class="tile"><h3>Qué se muestra</h3></div>`);
  const tog=(label,sub,key)=>{
    const r=$(`<div class="row"><div class="lbl"><b>${label}</b><span>${sub}</span></div></div>`);
    const sw=$(`<div class="sw${S[key]?' on':''}"><i></i></div>`);
    sw.onclick=()=>{S[key]=!S[key];save();Settings()}; r.append(sw); return r;
  };
  t1.append(tog('Guía de pronunciación','El texto en cursiva dorada','showPh'));
  t1.append(tog('Traducción al español','Debajo de cada frase en inglés','showEs'));
  view.append(t1);

  const t2=$(`<div class="tile"><h3>Tiempos y voz</h3></div>`);
  const stepper=(label,sub,key,min,max,stp,suffix)=>{
    const r=$(`<div class="row"><div class="lbl"><b>${label}</b><span>${sub}</span></div></div>`);
    const s=$(`<div class="step"></div>`);
    const m=$(`<button>−</button>`), p=$(`<button>+</button>`);
    const v=$(`<div class="v">${(Math.round(S[key]*100)/100)}${suffix}</div>`);
    m.onclick=()=>{S[key]=Math.max(min,Math.round((S[key]-stp)*100)/100);save();Settings()};
    p.onclick=()=>{S[key]=Math.min(max,Math.round((S[key]+stp)*100)/100);save();Settings()};
    s.append(m,v,p); r.append(s); return r;
  };
  t2.append(stepper('Pausa para responder','Segundos entre la pregunta y la respuesta','secQ',1,30,1,'s'));
  t2.append(stepper('Pausa antes de seguir','Segundos antes de la próxima pregunta','secA',0,20,1,'s'));
  t2.append(stepper('Velocidad del audio','1.0 = normal','rate',0.5,1.5,0.05,'×'));
  view.append(t2);

  const t2b=$(`<div class="tile"><h3>Audio</h3></div>`);
  if(AUDIO_OK===true){
    t2b.append($(`<div class="row"><div class="lbl"><b style="color:var(--good)">✓ Voz grabada</b>
      <span>${AUDIO_VOICE? esc(AUDIO_VOICE) : 'Clips de audio incluidos'} · suena igual en todos los teléfonos</span>
      </div></div>`));
  } else {
    t2b.append($(`<div class="row"><div class="lbl"><b>Voz del teléfono</b>
      <span>Sintetizada por Safari. Suena robótica y no se puede cambiar.</span></div></div>`));
    t2b.append($(`<p class="small" style="text-align:left;margin:10px 0 0">
      Safari no deja que una página web use las voces premium del iPhone, aunque estén descargadas.
      Para que suene natural hay que incluir clips de audio grabados junto a la app.</p>`));
  }
  const test=$(`<button class="btn ghost sm">🔊 Probar el audio</button>`);
  test.onclick=()=>{ say('q042','Who is Commander in Chief of the U.S. military?',
                        ()=>say('a042','The President of the United States')); };
  t2b.append(test);
  view.append(t2b);

  const t3=$(`<div class="tile"><h3>Datos</h3></div>`);
  const rst=$(`<button class="btn ghost sm">Borrar todo mi progreso</button>`);
  rst.onclick=()=>{ if(confirm('¿Borrar todas las estadísticas y empezar de cero?')){ ST={byQ:{},sessions:[]}; save(); go('home'); } };
  t3.append(rst); view.append(t3);

  const done=$(`<button class="btn">Listo</button>`); done.onclick=()=>go('home'); view.append(done);
}

/* ============ stats ============ */
function Stats(){
  titleEl.textContent='Estadísticas'; progBar.style.width='0';
  view.innerHTML='';
  const ss=ST.sessions;
  const tries=ss.length;
  const tot=ss.reduce((a,b)=>a+b.t,0), rt=ss.reduce((a,b)=>a+b.r,0);
  const secs=ss.reduce((a,b)=>a+b.s,0);
  const pct=tot?Math.round(rt/tot*100):0;
  view.append($(`<div class="grid">
    <div class="stat"><b>${tries}</b><span>SESIONES</span></div>
    <div class="stat"><b style="color:${pct>=60?'var(--good)':'var(--gold)'}">${pct}%</b><span>ACIERTO</span></div>
    <div class="stat"><b>${fmt(secs)}</b><span>TIEMPO TOTAL</span></div>
  </div>`));
  view.append($(`<div class="grid">
    <div class="stat"><b>${tot}</b><span>RESPONDIDAS</span></div>
    <div class="stat"><b style="color:var(--good)">${rt}</b><span>CORRECTAS</span></div>
    <div class="stat"><b style="color:var(--bad)">${tot-rt}</b><span>FALLADAS</span></div>
  </div>`));

  const map=$(`<div class="tile"><h3>Cada pregunta</h3>
     <p class="small" style="text-align:left;margin:-4px 0 10px">
     <span style="color:#c8f2d8">■</span> dominada &nbsp;
     <span style="color:#f5dfae">■</span> en progreso &nbsp;
     <span style="color:#f7c4c4">■</span> fallada &nbsp;
     <span style="color:#ffffff70">■</span> sin practicar</p></div>`);
  const bars=$(`<div class="bars"></div>`);
  DATA.forEach(d=>{
    const s=qstat(d.n); let c='';
    if(s.seen){ if(s.wrong===0&&s.right>=2)c='ok'; else if(s.right>s.wrong)c='mid'; else c='bad'; }
    const b=$(`<div class="qb ${c}">${d.n}</div>`);
    b.title=d.q; bars.append(b);
  });
  map.append(bars); view.append(map);

  if(ss.length){
    const h=$(`<div class="tile"><h3>Historial</h3><div class="hist"></div></div>`);
    const hh=h.querySelector('.hist');
    const names={cards:'Tarjetas',choice:'Opción múltiple',hands:'Manos libres',exam:'Examen'};
    ss.slice(0,12).forEach(s=>{
      hh.append($(`<div><span>${s.d} · ${names[s.m]||s.m}</span><span style="color:${s.r/s.t>=.6?'var(--good)':'var(--bad)'}">${s.r}/${s.t} · ${fmt(s.s)}</span></div>`));
    });
    view.append(h);
  }
  const home=$(`<button class="btn ghost">Volver</button>`); home.onclick=()=>go('home'); view.append(home);
}

/* ============ go ============ */
window.addEventListener('pagehide',()=>{ stopAll(); keepAwake(false); humOn(false); });
document.addEventListener('visibilitychange',()=>{
  const inHands = screen==='study' && sess && sess.mode==='hands';
  if(document.hidden){ clearTimers(); if(inHands && !sess.paused){ pauseHands(); render(); } }
  else if(inHands){ keepAwake(true); humOn(true); }
});
probeAudio().then(()=>{ if(screen==='settings'||screen==='home') render(); });
render();
</script>
</body>
</html>
